name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & sync Capacitor Android
        run: |
          npm install
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Enforce Android landscape orientation & Chinese app name
        run: |
          python3 - << 'EOF'
          import os
          import re

          # 1. Force sensorLandscape on MainActivity in AndroidManifest.xml
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              manifest = f.read()

          def patch_main_activity(match):
              tag = match.group(0)
              if 'android:screenOrientation=' in tag:
                  return re.sub(
                      r'android:screenOrientation="[^"]*"',
                      'android:screenOrientation="sensorLandscape"',
                      tag,
                  )
              return tag.replace(
                  'android:name=".MainActivity"',
                  'android:name=".MainActivity"\n            android:screenOrientation="sensorLandscape"',
                  1,
              )

          manifest_new, count = re.subn(
              r'<activity\b[^>]*android:name="[^"]*MainActivity"[^>]*>',
              patch_main_activity,
              manifest,
              count=1,
              flags=re.DOTALL,
          )
          assert count == 1, 'MainActivity tag not found in AndroidManifest.xml'
          assert 'android:screenOrientation="sensorLandscape"' in manifest_new
          with open(manifest_path, 'w', encoding='utf-8') as f:
              f.write(manifest_new)

          # 2. Enforce Chinese app_name & title_activity_main in strings.xml
          strings_path = 'android/app/src/main/res/values/strings.xml'
          if os.path.exists(strings_path):
              with open(strings_path, 'r', encoding='utf-8') as f:
                  strings_xml = f.read()
          else:
              os.makedirs(os.path.dirname(strings_path), exist_ok=True)
              strings_xml = '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n'

          for key in ('app_name', 'title_activity_main'):
              pat = rf'<string\s+name="{key}">[^<]*</string>'
              rep = f'<string name="{key}">墨土拾荒录</string>'
              if re.search(pat, strings_xml):
                  strings_xml = re.sub(pat, rep, strings_xml)
              else:
                  strings_xml = strings_xml.replace('</resources>', f'    {rep}\n</resources>')

          assert '<string name="app_name">墨土拾荒录</string>' in strings_xml
          assert '<string name="title_activity_main">墨土拾荒录</string>' in strings_xml
          with open(strings_path, 'w', encoding='utf-8') as f:
              f.write(strings_xml)

          print('Enforced sensorLandscape & app_name=墨土拾荒录 successfully!')
          EOF

      - name: Apply custom Mo-Jia Ink Crucible Android launcher icons
        run: |
          python3 -m pip install --quiet pillow
          python3 - << 'EOF'
          import os
          from PIL import Image, ImageDraw

          src = Image.open('web/assets/app_icon.png').convert('RGBA')
          res_root = 'android/app/src/main/res'

          launcher_sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          fg_sizes = {
              'mipmap-mdpi': 108,
              'mipmap-hdpi': 162,
              'mipmap-xhdpi': 216,
              'mipmap-xxhdpi': 324,
              'mipmap-xxxhdpi': 432,
          }

          for folder, sz in launcher_sizes.items():
              out_dir = os.path.join(res_root, folder)
              os.makedirs(out_dir, exist_ok=True)
              resized = src.resize((sz, sz), Image.LANCZOS)
              resized.save(os.path.join(out_dir, 'ic_launcher.png'))

              mask = Image.new('L', (sz, sz), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, sz - 1, sz - 1), fill=255)
              round_img = Image.new('RGBA', (sz, sz), (0, 0, 0, 0))
              round_img.paste(resized, (0, 0), mask)
              round_img.save(os.path.join(out_dir, 'ic_launcher_round.png'))

          for folder, sz in fg_sizes.items():
              out_dir = os.path.join(res_root, folder)
              os.makedirs(out_dir, exist_ok=True)
              canvas = Image.new('RGBA', (sz, sz), (18, 17, 16, 255))
              inner = int(sz * 0.72)
              pad = (sz - inner) // 2
              canvas.paste(src.resize((inner, inner), Image.LANCZOS), (pad, pad), src.resize((inner, inner), Image.LANCZOS))
              canvas.save(os.path.join(out_dir, 'ic_launcher_foreground.png'))

          bg_xml = os.path.join(res_root, 'values', 'ic_launcher_background.xml')
          if os.path.exists(bg_xml):
              with open(bg_xml, 'w') as f:
                  f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#121110</color>\n</resources>\n')
          print('Applied custom Android launcher icons successfully!')
          EOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: motu-shihuanglu-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
